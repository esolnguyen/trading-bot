<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trading Bot Dashboard</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <nav class="sidebar">
    <div class="sidebar-header">
      <h2>Trading Bot</h2>
    </div>
    <ul class="nav-list">
      <li><button class="nav-btn active" data-tab="overview">Overview</button></li>
      <li><button class="nav-btn" data-tab="brain">Brain Activity</button></li>
      <li><button class="nav-btn" data-tab="prompt">Last Prompt</button></li>
      <li><button class="nav-btn" data-tab="response">Last Response</button></li>
      <li><button class="nav-btn" data-tab="statistics">Statistics</button></li>
      <li><button class="nav-btn" data-tab="news">Latest News</button></li>
      <li><button class="nav-btn" data-tab="memory">Memory Bank</button></li>
      <li><button class="nav-btn" data-tab="visuals">Charts</button></li>
    </ul>
  </nav>
  <main class="content">
    <div id="tab-overview" class="tab-panel active">
      <h1>Overview</h1>
      <div class="kpi-grid" id="kpi-grid"></div>
      <div id="position-panel"></div>
    </div>
    <div id="tab-brain" class="tab-panel">
      <h1>Brain Activity</h1>
      <div id="brain-panel"></div>
    </div>
    <div id="tab-prompt" class="tab-panel">
      <h1>Last Prompt</h1>
      <div id="prompt-panel" class="log-viewer"></div>
    </div>
    <div id="tab-response" class="tab-panel">
      <h1>Last Response</h1>
      <div id="response-panel" class="log-viewer"></div>
    </div>
    <div id="tab-statistics" class="tab-panel">
      <h1>Statistics</h1>
      <div id="statistics-panel"></div>
    </div>
    <div id="tab-news" class="tab-panel">
      <h1>Latest News</h1>
      <div id="news-panel"></div>
    </div>
    <div id="tab-memory" class="tab-panel">
      <h1>Memory Bank</h1>
      <div id="vector-panel"></div>
    </div>
    <div id="tab-visuals" class="tab-panel">
      <h1>Charts</h1>
      <div id="visuals-panel"></div>
    </div>
  </main>
  <script type="module" src="/static/main.js?v=4.5"></script>
</body>
</html>
